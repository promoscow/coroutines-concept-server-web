services:
  io:
    build: ../coroutines-concept-io
    container_name: io
    ports:
      - "8021:8021"
    networks:
      - coroutines-concept-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/actuator/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      resources:
        limits:
          memory: 1G
  server:
    build: .
    container_name: server
    ports:
      - "8011:8011"
    environment:
      - APP_IO_HOST=http://io:8021
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=80.0
    depends_on:
      io:
        condition: service_healthy
    networks:
      - coroutines-concept-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/actuator/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 15s
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 6G
  client:
    build: ../coroutines-concept-client
    environment:
      - APP_REQUESTS_PER_SECOND=${CLIENT_RPS:-1000}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      server:
        condition: service_healthy
    networks:
      - coroutines-concept-network
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      replicas: ${CLIENT_REPLICAS:-1}
      resources:
        limits:
          memory: 512M
networks:
  coroutines-concept-network:
    driver: bridge
